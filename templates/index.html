<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Nhập Dữ Liệu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 550px; overflow-y: auto; }
        .selected-row { background-color: #d1e7dd !important; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <h3 class="text-center text-primary mb-4">QUẢN LÝ DỮ LIỆU THÔNG TIN NGƯỜI LIÊN QUAN</h3>
        
        <div class="row">
            <!-- CỘT BÊN TRÁI: FORM NHẬP DỮ LIỆU -->
            <div class="col-md-5 mb-4">
                <div class="card p-3">
                    <h5 class="card-title text-secondary border-bottom pb-2">Thông tin nhập liệu</h5>
                    <form id="personForm">
                        <input type="hidden" id="personId">
                        
                        <div class="mb-2">
                            <label class="form-label font-weight-bold">Họ và Tên CBNV (*)</label>
                            <input type="text" class="form-control" id="hoTenCBNV" required>
                        </div>

                        <div class="mb-2">
                            <label class="form-label">Quan hệ với nhân viên</label>
                            <input type="text" class="form-control" id="quanHeVoiNhanVien" placeholder="Ví dụ: Vợ, Chồng, Bố, Mẹ...">
                        </div>
                        
                        <div class="mb-2">
                            <label class="form-label">Họ và Tên người liên quan (*)</label>
                            <input type="text" class="form-control" id="hoTenNguoiLienQuan" required>
                        </div>
                        
                        <div class="mb-2">
                            <label class="form-label">Địa chỉ người liên quan</label>
                            <input type="text" class="form-control" id="diaChiNguoiLienQuan">
                        </div>
                        
                        <div class="mb-2">
                            <label class="form-label">Số căn cước người liên quan</label>
                            <input type="text" class="form-control" id="soCCCD">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Ngày cấp căn cước</label>
                                <input type="date" class="form-control" id="ngayCapCCCD">
                            </div>
                            <div class="col-md-6 mb-2">
                                <label class="form-label">Nơi cấp căn cước</label>
                                <input type="text" class="form-control" id="noiCapCCCD">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-control" id="soDienThoai">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-success flex-fill" onclick="saveData()">Lưu Thông Tin</button>
                            <button type="button" class="btn btn-secondary" onclick="resetForm()">Làm Mới Form</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- CỘT BÊN PHẢI: DANH SÁCH DỮ LIỆU -->
            <div class="col-md-7">
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="card-title text-secondary mb-0">Danh sách đã nhập</h5>
                        <div>
                            <button class="btn btn-success btn-sm me-1" onclick="exportExcel()">Xuất Excel</button>
                            <button class="btn btn-primary btn-sm" onclick="fetchPersons()">Load Dữ Liệu</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-hover table-bordered" id="dataTable">
                            <thead class="table-dark">
                                <tr>
                                    <th>STT</th>
                                    <th>Họ Tên CBNV</th>
                                    <th>Quan hệ</th>
                                    <th>Người Liên Quan</th>
                                    <th>Số CCCD</th>
                                    <th>SĐT</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="personTableBody">
                                <!-- Dữ liệu sẽ được tải vào đây -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript xử lý giao diện và gọi API -->
    <script>
        let currentPersons = [];

        async function fetchPersons() {
            try {
                const response = await fetch('/api/persons');
                currentPersons = await response.json();
                renderTable(currentPersons);
            } catch (error) {
                alert('Lỗi tải dữ liệu: ' + error);
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('personTableBody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Chưa có dữ liệu</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const row = document.createElement('tr');
                row.onclick = () => selectRow(item.id);
                row.style.cursor = 'pointer';
                
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.hoTenCBNV || ''}</td>
                    <td>${item.quanHeVoiNhanVien || ''}</td>
                    <td>${item.hoTenNguoiLienQuan || ''}</td>
                    <td>${item.soCCCD || ''}</td>
                    <td>${item.soDienThoai || ''}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="event.stopPropagation(); loadToForm(${item.id})">Sửa</button>
                        <button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); deletePerson(${item.id})">Xóa</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function saveData() {
            const id = document.getElementById('personId').value;
            const payload = {
                hoTenCBNV: document.getElementById('hoTenCBNV').value,
                quanHeVoiNhanVien: document.getElementById('quanHeVoiNhanVien').value,
                hoTenNguoiLienQuan: document.getElementById('hoTenNguoiLienQuan').value,
                diaChiNguoiLienQuan: document.getElementById('diaChiNguoiLienQuan').value,
                soCCCD: document.getElementById('soCCCD').value,
                ngayCapCCCD: document.getElementById('ngayCapCCCD').value,
                noiCapCCCD: document.getElementById('noiCapCCCD').value,
                soDienThoai: document.getElementById('soDienThoai').value
            };

            if (!payload.hoTenCBNV || !payload.hoTenNguoiLienQuan) {
                alert('Vui lòng điền đầy đủ Họ tên CBNV và Người liên quan!');
                return;
            }

            const url = id ? `/api/persons/${id}` : '/api/persons';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();
                
                if (result.success) {
                    alert(result.message);
                    resetForm();
                    fetchPersons();
                } else {
                    alert(result.message);
                }
            } catch (err) {
                alert('Có lỗi xảy ra khi lưu!');
            }
        }

        function loadToForm(id) {
            const item = currentPersons.find(p => p.id === id);
            if (item) {
                document.getElementById('personId').value = item.id;
                document.getElementById('hoTenCBNV').value = item.hoTenCBNV || '';
                document.getElementById('quanHeVoiNhanVien').value = item.quanHeVoiNhanVien || '';
                document.getElementById('hoTenNguoiLienQuan').value = item.hoTenNguoiLienQuan || '';
                document.getElementById('diaChiNguoiLienQuan').value = item.diaChiNguoiLienQuan || '';
                document.getElementById('soCCCD').value = item.soCCCD || '';
                document.getElementById('ngayCapCCCD').value = item.ngayCapCCCD || '';
                document.getElementById('noiCapCCCD').value = item.noiCapCCCD || '';
                document.getElementById('soDienThoai').value = item.soDienThoai || '';
            }
        }

        function selectRow(id) {
            loadToForm(id);
        }

        async function deletePerson(id) {
            if (confirm('Bạn có chắc chắn muốn xóa bản ghi này?')) {
                try {
                    const res = await fetch(`/api/persons/${id}`, { method: 'DELETE' });
                    const result = await res.json();
                    if (result.success) {
                        alert(result.message);
                        resetForm();
                        fetchPersons();
                    }
                } catch (err) {
                    alert('Lỗi khi xóa!');
                }
            }
        }

        function exportExcel() {
            window.location.href = '/api/export';
        }

        function resetForm() {
            document.getElementById('personForm').reset();
            document.getElementById('personId').value = '';
        }

        window.onload = fetchPersons;
    </script>
</body>
</html>
